[project]
name = "garmin"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "bullet",
    "flask",
    "flask-login>=0.6.3",
    "garminconnect",
    "Jinja2",
    "psycopg2-binary",
    "sqlmodel",
]

[dependency-groups]
dev = [
    "beautifulsoup4",
    "black",
    "freezegun",
    "isort",
    "markdown-it-py>=4.2.0",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.black]
# Pin target to the interpreter we run under; an open `requires-python = ">=3.15"`
# otherwise makes black target a newer version and fail its AST safety check on 3.15.
target-version = ["py315"]

[tool.isort]
# Match black's import wrapping so the two don't reformat each other's output.
profile = "black"

[tool.pytest.ini_options]
# src/ is the import root, so tests import modules (analytics, db, ...) directly.
pythonpath = ["src"]
testpaths = ["tests"]
